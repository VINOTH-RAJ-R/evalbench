[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "evalbench"
version = "0.1.0.dev0"
description = "Run candidate language models against your own labelled examples and catch prompt regressions before users do."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Vinoth Raj R" }]
keywords = ["llm", "evaluation", "benchmark", "regression-testing", "prompt-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
llm-json = ["llm-json @ git+https://github.com/VINOTH-RAJ-R/llm-json"]
dev = ["pytest>=7.4", "ruff>=0.6"]


[project.urls]
Homepage = "https://github.com/VINOTH-RAJ-R/evalbench"
Issues = "https://github.com/VINOTH-RAJ-R/evalbench/issues"

[tool.hatch.metadata]
# The llm-json extra points at a git URL because the PyPI name is taken by an
# unrelated package. Hatchling requires this opt-in for direct references.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/evalbench"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
